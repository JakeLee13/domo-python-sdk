[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "domo-sdk"
version = "0.2.0"
description = "Unified automation toolkit for Domo operations (LLM, email, data, apps, vector, web)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Domo FDE", email = "fde@domo.com" }]

dependencies = [
    "domojupyter>=1.0.0",
    "pydomo>=0.3.0",
    "requests>=2.28.0,<3.0.0",
    "urllib3>=1.26,<3.0",
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.24,<3.0",
    "scikit-learn>=1.3,<2.0",
    "beautifulsoup4>=4.11.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/domo-domosapiens/domo-python-sdk"
Repository = "https://github.com/domo-domosapiens/domo-python-sdk"

[tool.setuptools.packages.find]
where = ["."]
include = ["domo_sdk*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
