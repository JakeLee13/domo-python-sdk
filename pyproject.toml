[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "domo-sdk"
version = "0.1.0"
description = "Unified automation toolkit for Domo operations"
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "domojupyter>=1.0.0",
    "pydomo>=0.3.0", 
    "requests>=2.28.0,<3.0.0",
    "beautifulsoup4>=4.11.0,<5.0.0",
    "pandas>=1.4.0,<3.0.0",
    "numpy>=1.21.0,<2.0.0",
    "IPython>=8.0.0,<9.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0", 
    "flake8>=4.0.0",
    "mypy>=1.0.0"
]

[project.urls]
Documentation = "https://github.com/yourorg/domo-sdk/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["domo_sdk*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
